<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="/branding/codeshape-mark.svg" type="image/svg+xml" />
    <script>
      try {
        const saved = JSON.parse(localStorage.getItem('codeshape.v1') || '{}')
        if (saved.theme === 'dark' || saved.theme === 'light') document.documentElement.dataset.theme = saved.theme
        if (saved.lang === 'en' || saved.lang === 'de') document.documentElement.lang = saved.lang
      } catch (error) {}
    </script>
    <title>CodeShape</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
